{% extends "base.html" %}
{% block contenido %}
<form id="formulario">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required>
  <label for="clave">Clave</label>
  <input id="clave" name="clave" type="password" autocomplete="current-password" required>
  <div>
    <button type="submit">Entrar</button>
    <button type="button" class="sec" id="salir">Cerrar sesion</button>
  </div>
</form>
<div class="aviso" id="aviso" hidden></div>
{% endblock %}

{% block guion %}
<script>
  document.getElementById("formulario").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    try {
      const r = await api("/auth/login", {
        method: "POST",
        body: JSON.stringify({
          email: document.getElementById("email").value,
          clave: document.getElementById("clave").value,
        }),
      });
      guardarToken(r.token);
      avisar("aviso", "Sesion iniciada como " + r.usuario.nombre + " (" + r.usuario.rol + ")", false);
      document.getElementById("enlace-sesion").textContent = r.usuario.nombre + " (" + r.usuario.rol + ")";
    } catch (e) {
      avisar("aviso", e.message, true);
    }
  });

  document.getElementById("salir").addEventListener("click", async () => {
    try { await api("/auth/logout", { method: "POST" }); } catch (e) { /* idempotente */ }
    sessionStorage.removeItem("token");
    document.getElementById("enlace-sesion").textContent = "Iniciar sesion";
    avisar("aviso", "Sesion cerrada.", false);
  });
</script>
{% endblock %}
